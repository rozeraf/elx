# git-cliff config: `make changelog` regenerates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by [git-cliff](https://git-cliff.org) from [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{%- macro remote_url() -%}
  https://github.com/rozeraf/elx
{%- endmacro -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]\
  {%- if previous.version %}({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }})\
  {%- else %}({{ self::remote_url() }}/releases/tag/{{ version }}){% endif %} \
  - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]({{ self::remote_url() }}/compare/{{ previous.version }}...HEAD)
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | upper_first }} \
  ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only fix the section order; striptags removes them in the output.
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^merge", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(chore|build|ci)", group = "<!-- 7 -->Miscellaneous" },
]
